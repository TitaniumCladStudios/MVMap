          $("#i-area").onchange = (e) => { pushUndo(); r.areaId = e.target.value; S.activeAreaId = r.areaId; commit(); };
          $("#i-notes").oninput = (e) => { r.notes = e.target.value; scheduleSave(); };
          $("#i-clear-color").onclick = () => { pushUndo(); r.color = null; commit(); };
          $("#i-detail").onclick = () => openDetail(r.id);
          $("#i-del").onclick = () => { pushUndo(); deleteRoom(r.id); commit(); };
          host.querySelectorAll("[data-color]").forEach((b2) => {
            b2.onclick = () => { pushUndo(); r.color = b2.dataset.color; commit(); };
          });
        }

        function inspectDoor(host, d) {
          if (!d) return;
          const lock = d.lockId ? lockById(d.lockId) : null;
          const cells = edgeCells(d).map(([x, y]) => roomAtCell(x, y));
          host.innerHTML = `
            <div class="insp-title"><span class="swatch" style="background:${lock ? lock.color : "#93a0b4"}"></span>
              <span class="kind">Door</span></div>
            <div class="fld"><label>Type</label>
              <div class="seg" id="i-kind">
                <button data-kind="passage" class="${d.kind === "passage" ? "on" : ""}">Passage</button>
                <button data-kind="door" class="${d.kind === "door" ? "on" : ""}">Door</button>
                <button data-kind="oneway" class="${d.kind === "oneway" ? "on" : ""}">One-way</button>
              </div>
            </div>
            ${
              d.kind === "oneway"
                ? `<div class="fld"><label>Direction</label><button class="btn" id="i-flip">Passable ${
                    d.o === "v" ? (d.dir === 1 ? "→ east" : "← west") : d.dir === 1 ? "↓ south" : "↑ north"
                  } — flip</button></div>`
                : ""
            }
            <div class="fld"><label>Lock</label>
              <select id="i-lock">
                <option value="">— unlocked —</option>
                ${S.doc.locks.map((l) => `<option value="${l.id}" ${l.id === d.lockId ? "selected" : ""}>${esc(l.name)}</option>`).join("")}
                <option value="__new">+ New lock…</option>
              </select>
            </div>
            ${
              lock
                ? `<div class="fld"><label>Opened by</label>${keyToggleList(lock)}</div>
                   <button class="btn" id="i-sel-lock">Select lock “${esc(lock.name)}”</button>`
                : ""
            }
            <div class="meta">Between ${cells.map((c) => (c ? esc(c.name) : "void")).join(" ↔ ")}</div>
            <div class="btn-row"><button class="btn danger" id="i-del">Delete door</button></div>`;

          host.querySelectorAll("#i-kind button").forEach((b) => {
            b.onclick = () => { pushUndo(); d.kind = b.dataset.kind; commit(); };
          });
          const flip = $("#i-flip");
          if (flip) flip.onclick = () => { pushUndo(); d.dir = -d.dir; commit(); };
          $("#i-lock").onchange = (e) => {
            pushUndo();
            if (e.target.value === "__new") { const l = createLock(); d.lockId = l.id; }
            else d.lockId = e.target.value || null;
            commit();
          };
          const sl = $("#i-sel-lock");
          if (sl) sl.onclick = () => { S.sel = { type: "lock", id: lock.id }; commit(true); };
          bindKeyToggles(host, lock);
          $("#i-del").onclick = () => { pushUndo(); deleteDoor(d.id); commit(); };
        }

        function keyToggleList(lock) {
          if (!S.doc.keys.length) return `<div class="meta">No keys exist yet — place one with the Key tool.</div>`;
          return `<div class="link-list">${S.doc.keys
            .map(
              (k) => `<label class="check"><input type="checkbox" data-keytoggle="${k.id}" ${
                lock.keyIds.includes(k.id) ? "checked" : ""
              } /><span class="swatch rnd" style="background:${k.color}"></span><span>${esc(k.name)}</span></label>`
            )
            .join("")}</div>`;
        }
        function bindKeyToggles(host, lock) {
          if (!lock) return;
          host.querySelectorAll("[data-keytoggle]").forEach((cb) => {
            cb.onchange = () => {
              pushUndo();
              const id = cb.dataset.keytoggle;
              if (cb.checked) { if (!lock.keyIds.includes(id)) lock.keyIds.push(id); }
              else lock.keyIds = lock.keyIds.filter((x) => x !== id);
              commit();
            };
          });
        }

        function inspectKey(host, k) {
          if (!k) return;
          const room = roomAtCell(k.x, k.y);
          const opens = S.doc.locks.filter((l) => l.keyIds.includes(k.id));
          host.innerHTML = `
            <div class="insp-title"><span class="swatch rnd" style="background:${k.color}"></span>
              <span class="kind">Key</span></div>
            <div class="fld"><label>Name</label><input type="text" id="i-name" value="${esc(k.name)}" placeholder="Double Jump, Red Key…" /></div>
            <div class="fld"><label>Colour</label>${colorChips(LOCK_COLORS, k.color, "kcolor")}</div>
            <div class="fld"><label>Opens</label>
              ${
                S.doc.locks.length
                  ? `<div class="link-list">${S.doc.locks
                      .map(
                        (l) => `<label class="check"><input type="checkbox" data-locktoggle="${l.id}" ${
                          l.keyIds.includes(k.id) ? "checked" : ""
                        } /><span class="swatch" style="background:${l.color}"></span><span>${esc(l.name)}</span></label>`
                      )
                      .join("")}</div>`
                  : `<div class="meta">No locks yet.</div>`
              }
            </div>
            <div class="meta">Cell ${k.x}, ${k.y}${room ? " · in " + esc(room.name) : ""} · opens ${opens.length} lock(s)</div>
            <div class="btn-row"><button class="btn danger" id="i-del">Delete key</button></div>`;

          $("#i-name").oninput = (e) => { k.name = e.target.value; needsDraw = true; renderKeys(); scheduleSave(); };
          undoOnFocus($("#i-name"));
          host.querySelectorAll("[data-kcolor]").forEach((b) => {
            b.onclick = () => { pushUndo(); k.color = b.dataset.kcolor; commit(); };
          });
          host.querySelectorAll("[data-locktoggle]").forEach((cb) => {
            cb.onchange = () => {
              pushUndo();
              const l = lockById(cb.dataset.locktoggle);
              if (cb.checked) { if (!l.keyIds.includes(k.id)) l.keyIds.push(k.id); }
              else l.keyIds = l.keyIds.filter((x) => x !== k.id);
              commit();
            };
          });
          $("#i-del").onclick = () => { pushUndo(); deleteKey(k.id); commit(); };
        }

        function inspectLock(host, l) {
          if (!l) return;
          const doors = S.doc.doors.filter((d) => d.lockId === l.id);
          const keys = l.keyIds.map(keyById).filter(Boolean);
          host.innerHTML = `
            <div class="insp-title"><span class="swatch" style="background:${l.color}"></span>
              <span class="kind">Lock</span></div>
            <div class="fld"><label>Name</label><input type="text" id="i-name" value="${esc(l.name)}" placeholder="Grapple gate…" /></div>
            <div class="fld"><label>Colour</label>${colorChips(LOCK_COLORS, l.color, "lcolor")}</div>
            <div class="fld"><label>Opened by any of</label>${keyToggleList(l)}</div>
            <div class="meta">${doors.length} door(s) use this lock · ${keys.length} key(s) open it${
            doors.length && !keys.length ? ` · <span style="color:#e0a13a">soft-locked: no key assigned</span>` : ""
          }</div>
            <div class="btn-row"><button class="btn danger" id="i-del">Delete lock</button></div>`;

          $("#i-name").oninput = (e) => { l.name = e.target.value; renderLocks(); scheduleSave(); };
          undoOnFocus($("#i-name"));
          host.querySelectorAll("[data-lcolor]").forEach((b) => {
            b.onclick = () => { pushUndo(); l.color = b.dataset.lcolor; commit(); };
          });
          bindKeyToggles(host, l);
          $("#i-del").onclick = () => { pushUndo(); deleteLock(l.id); commit(); };
        }

        /** Text fields mutate on every keystroke — take one undo snapshot per editing session. */
        function undoOnFocus() {
          for (const el of arguments) if (el) el.addEventListener("focus", () => pushUndo());
        }

        /* ── Panel event delegation ────────────────────────────────── */
        $("#tools").addEventListener("click", (e) => {
          const b = e.target.closest("[data-tool]");
          if (b) setTool(b.dataset.tool);
        });

        $("#area-list").addEventListener("click", (e) => {
          const sw = e.target.closest("[data-swatch]");
          if (sw) {
            const a = areaById(sw.dataset.swatch);
            pushUndo();
            a.color = AREA_COLORS[(AREA_COLORS.indexOf(a.color) + 1) % AREA_COLORS.length];
            commit();
            return;
          }
          const del = e.target.closest("[data-delarea]");
          if (del) {
            const id = del.dataset.delarea;
            if (S.doc.areas.length < 2) return;
            pushUndo();
            S.doc.areas = S.doc.areas.filter((a) => a.id !== id);
            const fallback = S.doc.areas[0].id;
            S.doc.rooms.forEach((r) => { if (r.areaId === id) r.areaId = fallback; });
            if (S.activeAreaId === id) S.activeAreaId = fallback;
            commit();
            return;
          }
          const row = e.target.closest("[data-area]");
          if (row) { setActiveArea(row.dataset.area); commit(true); }
        });
        $("#area-list").addEventListener("input", (e) => {
          const inp = e.target.closest("[data-rename]");
          if (!inp) return;
          areaById(inp.dataset.rename).name = inp.value;
          needsDraw = true;
          renderRooms();
          scheduleSave();
        });

        $("#room-list").addEventListener("click", (e) => {
          const row = e.target.closest("[data-room]");
          if (!row) return;
          const r = roomById(row.dataset.room);
          S.sel = { type: "room", id: r.id };
          S.activeRoomId = r.id;
          S.activeAreaId = r.areaId;
          commit(true);
        });
        $("#room-list").addEventListener("dblclick", (e) => {
          const row = e.target.closest("[data-room]");
          if (row) openDetail(row.dataset.room);
        });
        $("#lock-list").addEventListener("click", (e) => {
          const row = e.target.closest("[data-lock]");
          if (row) { S.sel = { type: "lock", id: row.dataset.lock }; commit(true); }
        });
        $("#key-list").addEventListener("click", (e) => {
          const row = e.target.closest("[data-key]");
          if (!row) return;
          S.sel = { type: "key", id: row.dataset.key };
          const k = keyById(row.dataset.key);
          if (k) { S.cam.x = k.x * CELL + CELL / 2; S.cam.y = k.y * CELL + CELL / 2; }
          commit(true);
        });

        /** Open a fresh, empty room in `areaId` and arm the Paint tool on it. */
        function startNewRoom(areaId) {
          S.activeRoomId = null;
          S.sel = null;
          const r = createRoom(areaId);
          S.sel = { type: "room", id: r.id };
          setTool("paint");
          return r;
        }
        $("#btn-add-area").onclick = () => {
          pushUndo();
          const a = {
            id: uid("area"),
            name: "Area " + (S.doc.areas.length + 1),
            color: AREA_COLORS[S.doc.areas.length % AREA_COLORS.length],
          };
          S.doc.areas.push(a);
          S.activeAreaId = a.id;
          startNewRoom(a.id);
          commit();
        };
        $("#btn-add-room").onclick = () => {
          pushUndo();
          startNewRoom(activeArea().id);
          commit();
        };
        $("#btn-add-lock").onclick = () => {
          pushUndo();
          const l = createLock();
          S.sel = { type: "lock", id: l.id };
          commit();
        };
        $("#chk-flow").onchange = (e) => { S.showFlow = e.target.checked; needsDraw = true; };
        $("#chk-labels").onchange = (e) => { S.showLabels = e.target.checked; needsDraw = true; };
        $("#btn-fit").onclick = fitWorld;
        $("#btn-undo").onclick = undo;
        $("#btn-redo").onclick = redo;
        $("#map-name").oninput = (e) => { S.doc.name = e.target.value; scheduleSave(); };
        $("#map-name").addEventListener("focus", () => pushUndo());
        $("#area-list").addEventListener("focusin", (e) => {
          if (e.target.matches("[data-rename]")) pushUndo();
        });

        /* ══════════════════════════════════════════════════════════════
           14 · Grey-box (room detail) editor
           ══════════════════════════════════════════════════════════════ */
        const dCanvas = $("#detail-canvas");
        const dctx = dCanvas.getContext("2d");
        let DW = 0, DH = 0;

        function detailData(roomId) {
          if (!S.doc.detail[roomId]) S.doc.detail[roomId] = { sub: 8, boxes: [] };
          const d = S.doc.detail[roomId];
          if (!Array.isArray(d.boxes)) d.boxes = [];
          if (!d.sub) d.sub = 8;
          return d;
        }
        function openDetail(roomId) {
          const room = roomById(roomId);
          if (!room || !room.cells.length) return;
          S.detailRoomId = roomId;
          S.dsel = null;
          const det = detailData(roomId);
          $("#detail-sub").value = String(det.sub);
          $("#detail-title").textContent = room.name;
          $("#detail").hidden = false;
          setDTool(S.dtool);
          renderTypePalette();
          fitDetail();
          needsDraw = true;
        }
        function closeDetail() {
          S.detailRoomId = null;
          S.dsel = null;
          $("#detail").hidden = true;
          $("#detail-inspector").hidden = true;
          needsDraw = true;
        }
        function fitDetail() {
          const room = roomById(S.detailRoomId);
          const det = detailData(S.detailRoomId);
          const b = roomBBox(room);
          if (!b) return;
          const r = dCanvas.getBoundingClientRect();
          DW = Math.max(1, Math.round(r.width));
          DH = Math.max(1, Math.round(r.height));
          const pw = b.w * det.sub * DCELL, ph = b.h * det.sub * DCELL;
          S.dcam.x = (b.x0 * det.sub + (b.w * det.sub) / 2) * DCELL;
          S.dcam.y = (b.y0 * det.sub + (b.h * det.sub) / 2) * DCELL;
          S.dcam.zoom = clamp(Math.min((DW - 70) / pw, (DH - 70) / ph), 0.05, 4);
          needsDraw = true;
        }
        function setDTool(t) {
          S.dtool = t;
          document.querySelectorAll("#detail-tools .tool").forEach((b) => b.classList.toggle("on", b.dataset.dtool === t));
          dCanvas.style.cursor = t === "pan" ? "grab" : t === "select" ? "default" : "crosshair";
          needsDraw = true;
        }
        function renderTypePalette() {
          $("#detail-types").innerHTML = BOX_TYPES.map(
            (t) => `<button class="ty ${t.id === S.dtype ? "on" : ""}" data-dtype="${t.id}">
                <span class="swatch" style="background:${t.color}"></span>${t.name}</button>`
          ).join("");
        }
        $("#detail-types").addEventListener("click", (e) => {
          const b = e.target.closest("[data-dtype]");
          if (!b) return;
          S.dtype = b.dataset.dtype;
          if (S.dsel) {
            const box = detailData(S.detailRoomId).boxes.find((x) => x.id === S.dsel);
            if (box) { pushUndo(); box.type = S.dtype; commit(); }
          }
          renderTypePalette();
          renderDetailInspector();
          needsDraw = true;
        });
        $("#detail-tools").addEventListener("click", (e) => {
          const b = e.target.closest("[data-dtool]");
          if (b) setDTool(b.dataset.dtool);
        });
        $("#detail-close").onclick = closeDetail;
        $("#detail-fit").onclick = fitDetail;
        $("#detail-sub").onchange = (e) => {
          const det = detailData(S.detailRoomId);
          const next = +e.target.value;
          if (next === det.sub) return;
          pushUndo();
          const f = next / det.sub;
          det.boxes.forEach((b) => {
            b.x = Math.round(b.x * f); b.y = Math.round(b.y * f);
            b.w = Math.max(1, Math.round(b.w * f)); b.h = Math.max(1, Math.round(b.h * f));
          });
          det.sub = next;
          commit();
          fitDetail();
        };

        function drawDetail() {
          const room = roomById(S.detailRoomId);
          if (!room) return;
          const det = detailData(S.detailRoomId);
          const [w, h] = resizeCanvas(dCanvas, dctx);
          DW = w; DH = h;
          const V = makeView(S.dcam, w, h);
          const sub = det.sub, U = DCELL; // one sub-cell = DCELL px at zoom 1
          const z = S.dcam.zoom;

          dctx.fillStyle = "#0e1116";
          dctx.fillRect(0, 0, w, h);

          // in-room floor
          dctx.fillStyle = "#181d26";
          for (const c of room.cells) {
            const [cx, cy] = unck(c);
            dctx.fillRect(V.sx(cx * sub * U), V.sy(cy * sub * U), sub * U * z + 0.5, sub * U * z + 0.5);
          }

          // sub-grid
          const step = U * z;
          const x0 = Math.floor(V.wx(0) / U), x1 = Math.ceil(V.wx(w) / U);
          const y0 = Math.floor(V.wy(0) / U), y1 = Math.ceil(V.wy(h) / U);
          if (step >= 4) {
            dctx.strokeStyle = "#1e2430";
            dctx.lineWidth = 1;
            dctx.beginPath();
            for (let x = x0; x <= x1; x++) {
              if (x % sub === 0) continue;
              const px = Math.round(V.sx(x * U)) + 0.5;
              dctx.moveTo(px, 0); dctx.lineTo(px, h);
            }
            for (let y = y0; y <= y1; y++) {
              if (y % sub === 0) continue;
              const py = Math.round(V.sy(y * U)) + 0.5;
              dctx.moveTo(0, py); dctx.lineTo(w, py);
            }
            dctx.stroke();
          }
          // world-cell grid
          dctx.strokeStyle = "#333e50";
          dctx.beginPath();
          for (let x = Math.ceil(x0 / sub) * sub; x <= x1; x += sub) {
            const px = Math.round(V.sx(x * U)) + 0.5;
            dctx.moveTo(px, 0); dctx.lineTo(px, h);
          }
          for (let y = Math.ceil(y0 / sub) * sub; y <= y1; y += sub) {
            const py = Math.round(V.sy(y * U)) + 0.5;
            dctx.moveTo(0, py); dctx.lineTo(w, py);
          }
          dctx.stroke();

          // room silhouette
          const set = new Set(room.cells);
          dctx.strokeStyle = roomColor(room);
          dctx.lineWidth = 2;
          dctx.beginPath();
          for (const c of room.cells) {
            const [cx, cy] = unck(c);
            const L = V.sx(cx * sub * U), T = V.sy(cy * sub * U);
            const R = V.sx((cx + 1) * sub * U), B = V.sy((cy + 1) * sub * U);
            if (!set.has(ck(cx, cy - 1))) { dctx.moveTo(L, T); dctx.lineTo(R, T); }
            if (!set.has(ck(cx, cy + 1))) { dctx.moveTo(L, B); dctx.lineTo(R, B); }
            if (!set.has(ck(cx - 1, cy))) { dctx.moveTo(L, T); dctx.lineTo(L, B); }
            if (!set.has(ck(cx + 1, cy))) { dctx.moveTo(R, T); dctx.lineTo(R, B); }
          }
          dctx.stroke();

          // doors on the room border, as anchors while greyboxing
          for (const d of S.doc.doors) {
            const cs = edgeCells(d);
            if (!cs.some(([x, y]) => set.has(ck(x, y)))) continue;
            const lock = d.lockId ? lockById(d.lockId) : null;
            const along = sub * U * z * 0.5, thick = clamp(sub * U * z * 0.12, 3, 14);
            const cx = V.sx(d.o === "v" ? d.x * sub * U : (d.x * sub + sub / 2) * U);
            const cy = V.sy(d.o === "v" ? (d.y * sub + sub / 2) * U : d.y * sub * U);
            dctx.fillStyle = lock ? lock.color : "#93a0b4";
            const bw = d.o === "v" ? thick : along, bh = d.o === "v" ? along : thick;
            roundRect(dctx, cx - bw / 2, cy - bh / 2, bw, bh, 2);
            dctx.fill();
          }

          // boxes
          dctx.textAlign = "center";
          dctx.textBaseline = "middle";
          for (const b of det.boxes) {
            const t = boxType(b.type);
            const px = V.sx(b.x * U), py = V.sy(b.y * U);
            const pw = b.w * U * z, ph = b.h * U * z;
            if (px > w || py > h || px + pw < 0 || py + ph < 0) continue;
            dctx.fillStyle = hexA(t.color, 0.32);
            dctx.fillRect(px, py, pw, ph);
            dctx.strokeStyle = t.color;
            dctx.lineWidth = b.id === S.dsel ? 2.5 : 1.4;
            dctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
            if (b.label && pw > 26 && ph > 12) {
              const fs = clamp(Math.round(11 * Math.min(1.4, z * 1.4)), 9, 15);
              dctx.font = `500 ${fs}px ${FONTF}`;
              dctx.fillStyle = shade(t.color, 0.35);
              dctx.fillText(b.label, px + pw / 2, py + ph / 2);
            }
            if (b.id === S.dsel) {
              dctx.fillStyle = "#ffffff";
              dctx.fillRect(px + pw - 5, py + ph - 5, 9, 9);
              dctx.strokeStyle = "#0e1116";
              dctx.lineWidth = 1;
              dctx.strokeRect(px + pw - 5.5, py + ph - 5.5, 10, 10);
            }
          }

          // drag preview
          if (S.ddrag && S.ddrag.type === "box") {
            const r = normRect(S.ddrag.a, S.ddrag.b);
            const t = boxType(S.dtype);
            dctx.fillStyle = hexA(t.color, 0.22);
            dctx.strokeStyle = t.color;
            dctx.lineWidth = 1.5;
            dctx.fillRect(V.sx(r.x * U), V.sy(r.y * U), r.w * U * z, r.h * U * z);
            dctx.strokeRect(V.sx(r.x * U) + 0.5, V.sy(r.y * U) + 0.5, r.w * U * z - 1, r.h * U * z - 1);
          }
        }

        function normRect(a, b) {
          const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
          return { x, y, w: Math.abs(b.x - a.x) + 1, h: Math.abs(b.y - a.y) + 1 };
        }
        function dEvPos(e) {
          const r = dCanvas.getBoundingClientRect();
          return { x: e.clientX - r.left, y: e.clientY - r.top };
        }
        function dSubAt(V, p) {
          return { x: Math.floor(V.wx(p.x) / DCELL), y: Math.floor(V.wy(p.y) / DCELL) };
        }
        function boxAt(det, sx, sy) {
          for (let i = det.boxes.length - 1; i >= 0; i--) {
            const b = det.boxes[i];
            if (sx >= b.x && sx < b.x + b.w && sy >= b.y && sy < b.y + b.h) return b;
          }
          return null;
        }

        dCanvas.addEventListener("pointerdown", (e) => {
          const V = makeView(S.dcam, DW, DH);
          const p = dEvPos(e);
          const s = dSubAt(V, p);
          const det = detailData(S.detailRoomId);

          if (e.button === 1 || S.spaceDown || S.dtool === "pan") {
            dCanvas.setPointerCapture(e.pointerId);
            S.ddrag = { type: "pan", last: p };
            return;
          }
          if (e.button === 2) return;
          dCanvas.setPointerCapture(e.pointerId);

          if (S.dtool === "box") {
            S.ddrag = { type: "box", a: s, b: s };
            needsDraw = true;
            return;
          }
          if (S.dtool === "erase") {
            const b = boxAt(det, s.x, s.y);
            if (b) {
              pushUndo();
              det.boxes = det.boxes.filter((x) => x !== b);
              if (S.dsel === b.id) S.dsel = null;
              commit();
              renderDetailInspector();
            }
            S.ddrag = { type: "erase" };
            return;
          }
          if (S.dtool === "select") {
            const sel = det.boxes.find((x) => x.id === S.dsel);
            if (sel) {
              // bottom-right resize handle, in screen space
              const hx = V.sx((sel.x + sel.w) * DCELL), hy = V.sy((sel.y + sel.h) * DCELL);
              if (Math.abs(p.x - hx) < 9 && Math.abs(p.y - hy) < 9) {
                S.ddrag = { type: "resize", box: sel, undone: false };
                return;
              }
            }
            const b = boxAt(det, s.x, s.y);
            S.dsel = b ? b.id : null;
            if (b) S.ddrag = { type: "movebox", box: b, start: s, ox: b.x, oy: b.y, undone: false };
            renderDetailInspector();
            needsDraw = true;
          }
        });

        dCanvas.addEventListener("pointermove", (e) => {
          const V = makeView(S.dcam, DW, DH);
          const p = dEvPos(e);
          const s = dSubAt(V, p);
          const det = detailData(S.detailRoomId);
          const d = S.ddrag;
          if (!d) return;

          if (d.type === "pan") {
            S.dcam.x -= (p.x - d.last.x) / S.dcam.zoom;
            S.dcam.y -= (p.y - d.last.y) / S.dcam.zoom;
            d.last = p;
            needsDraw = true;
          } else if (d.type === "box") {
            d.b = s;
            needsDraw = true;
          } else if (d.type === "erase") {
            const b = boxAt(det, s.x, s.y);
            if (b) {
              if (!d.undone) { pushUndo(); d.undone = true; }
              det.boxes = det.boxes.filter((x) => x !== b);
              commit();
            }
          } else if (d.type === "movebox") {
            const nx = d.ox + (s.x - d.start.x), ny = d.oy + (s.y - d.start.y);
            if (nx !== d.box.x || ny !== d.box.y) {
              if (!d.undone) { pushUndo(); d.undone = true; }
              d.box.x = nx; d.box.y = ny;
              needsDraw = true;
              scheduleSave();
            }
          } else if (d.type === "resize") {
            const nw = Math.max(1, s.x - d.box.x + 1), nh = Math.max(1, s.y - d.box.y + 1);
            if (nw !== d.box.w || nh !== d.box.h) {
              if (!d.undone) { pushUndo(); d.undone = true; }
              d.box.w = nw; d.box.h = nh;
              needsDraw = true;
              scheduleSave();
            }
          }
        });

        function endDDrag() {
          const d = S.ddrag;
          if (!d) return;
          if (d.type === "box") {
            const r = normRect(d.a, d.b);
            pushUndo();
            const box = { id: uid("box"), x: r.x, y: r.y, w: r.w, h: r.h, type: S.dtype, label: "" };
            detailData(S.detailRoomId).boxes.push(box);
            S.dsel = box.id;
            commit();
            renderDetailInspector();
          }
          S.ddrag = null;
          needsDraw = true;
          flushUI();
        }
        dCanvas.addEventListener("pointerup", endDDrag);
        dCanvas.addEventListener("pointercancel", endDDrag);
        dCanvas.addEventListener("contextmenu", (e) => e.preventDefault());
        dCanvas.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const V = makeView(S.dcam, DW, DH);
            const p = dEvPos(e);
            zoomAt(S.dcam, p.x, p.y, Math.pow(0.999, e.deltaY), V);
            needsDraw = true;
          },
          { passive: false }
        );

        const DTOOL_KEYS = { b: "box", v: "select", e: "erase", h: "pan" };
        function detailKey(e) {
          if (e.key === "Escape") { S.dsel ? ((S.dsel = null), renderDetailInspector(), (needsDraw = true)) : closeDetail(); return; }
          if (e.key === "f") { fitDetail(); return; }
          const t = DTOOL_KEYS[e.key.toLowerCase()];
          if (t) { setDTool(t); return; }
          const n = parseInt(e.key, 10);
          if (n >= 1 && n <= 9 && BOX_TYPES[n - 1]) {
            S.dtype = BOX_TYPES[n - 1].id;
            renderTypePalette();
            needsDraw = true;
            return;
          }
          if (e.key === "Delete" || e.key === "Backspace") {
            if (!S.dsel) return;
            pushUndo();
            const det = detailData(S.detailRoomId);
            det.boxes = det.boxes.filter((b) => b.id !== S.dsel);
            S.dsel = null;
            commit();
            renderDetailInspector();
          }
        }

        function renderDetailInspector() {
          const host = $("#detail-inspector");
          if (!S.dsel || !S.detailRoomId) { host.hidden = true; return; }
          const det = detailData(S.detailRoomId);
          const b = det.boxes.find((x) => x.id === S.dsel);
          if (!b) { host.hidden = true; return; }
          host.hidden = false;
          host.innerHTML = `
            <div class="insp-title"><span class="swatch" style="background:${boxType(b.type).color}"></span>
              <span class="kind">${esc(boxType(b.type).name)}</span></div>
            <div class="fld"><label>Type</label><select id="d-type">${BOX_TYPES.map(
              (t) => `<option value="${t.id}" ${t.id === b.type ? "selected" : ""}>${t.name}</option>`
            ).join("")}</select></div>
            <div class="fld"><label>Label</label><input type="text" id="d-label" value="${esc(b.label)}" placeholder="optional" /></div>
            <div class="meta">${b.w}×${b.h} sub-cells at ${b.x}, ${b.y}</div>
            <div class="btn-row"><button class="btn danger" id="d-del">Delete</button></div>`;
          $("#d-type").onchange = (e) => {
            pushUndo(); b.type = e.target.value; S.dtype = b.type;
            renderTypePalette(); commit(); renderDetailInspector();
          };
          $("#d-label").oninput = (e) => { b.label = e.target.value; needsDraw = true; scheduleSave(); };
          undoOnFocus($("#d-label"));
          $("#d-del").onclick = () => {
            pushUndo();
            det.boxes = det.boxes.filter((x) => x.id !== b.id);
            S.dsel = null;
            commit();
            renderDetailInspector();
          };
        }

        /* ══════════════════════════════════════════════════════════════
           15 · Import / export
           ══════════════════════════════════════════════════════════════ */
        function exportJSON() {
          S.doc.updated = Date.now();
          const blob = new Blob([JSON.stringify(S.doc, null, 2)], { type: "application/json" });
          saveBlob(blob, slug(S.doc.name) + ".mvmap.json");
        }
        $("#btn-export").onclick = exportJSON;
        $("#btn-import").onclick = () => $("#file-input").click();
        $("#file-input").onchange = (e) => {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          const rd = new FileReader();
          rd.onload = () => {
            try {
              const d = migrate(JSON.parse(rd.result));
              d.id = uid("map"); // import as a new map, never clobber
              loadDoc(d);
            } catch (err) {
              alert("Could not read that file: " + err.message);
            }
          };
          rd.readAsText(f);
          e.target.value = "";
        };

        function exportPNG() {
          const b = docBBox();
          if (!b) { alert("Nothing to export yet."); return; }
          const pad = 1;
          const cols = b.x1 - b.x0 + 1 + pad * 2, rows = b.y1 - b.y0 + 1 + pad * 2;
          const scale = clamp(Math.floor(4096 / Math.max(cols, rows)), 8, 48);
          const w = cols * scale, h = rows * scale;
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          const cx = c.getContext("2d");
          const cam = {
            x: (b.x0 - pad + cols / 2) * CELL,
            y: (b.y0 - pad + rows / 2) * CELL,
            zoom: scale / CELL,
          };
          drawWorld(cx, makeView(cam, w, h), { cursor: false, bg: "#12151b", labels: S.showLabels });
          c.toBlob((blob) => saveBlob(blob, slug(S.doc.name) + ".png"), "image/png");
        }
        $("#btn-png").onclick = exportPNG;

        /* ══════════════════════════════════════════════════════════════
           16 · Documents
           ══════════════════════════════════════════════════════════════ */
        function loadDoc(d) {
          S.doc = migrate(d);
          S.sel = null;
          S.activeRoomId = null;
          S.activeAreaId = S.doc.areas[0].id;
          undoStack.length = 0;
          redoStack.length = 0;
          closeDetail();
          $("#map-name").value = S.doc.name;
          commit();
          fitWorld();
        }
        $("#btn-new").onclick = () => {
          if (S.doc.rooms.length && !confirm("Start a new map? The current one stays saved in your library.")) return;
          loadDoc(newDoc());
        };

        /* ══════════════════════════════════════════════════════════════
           17 · Modals
           ══════════════════════════════════════════════════════════════ */
        function openModal(html) {
          $("#modal-box").innerHTML = html;
          $("#modal").hidden = false;
        }
        function closeModal() { $("#modal").hidden = true; }
        $("#modal").addEventListener("click", (e) => {
          if (e.target.id === "modal" || e.target.dataset.close != null) closeModal();
        });

        $("#btn-help").onclick = () => {
          openModal(`
            <h2>MVMap — Metroidvania Map Editor</h2>
            <p>A tool for laying out metroidvania worlds: paint rooms onto grid paper, colour them by area,
               connect them with doors, and model progression with locks and keys.</p>
            <h3>Rooms</h3>
            <p>Press <b>+</b> above the room list to open a new room in the active area, then drag on the grid
               to paint its cells — a room is any set of cells, so L-shapes and corridors are fine.
               <b>Shift</b>+paint also starts a new room without leaving the canvas. Adding an area opens a
               room in it automatically.</p>
            <h3>Locks &amp; keys</h3>
            <p>The core metroidvania principle is that the map is non-linear and gated. New areas are
               <em>locked</em>, and the player must find a <em>key</em> elsewhere to get through. A key is rarely a
               literal key — it's a movement ability, an item, or a story beat. One lock can have several keys,
               and one key can open many locks.</p>
            <p>Place a door on a cell edge, assign it a lock, then tick which keys open that lock. Selecting a
               lock or key draws the links between them, so you can read the progression flow at a glance.
               A lock with doors but no keys is flagged as a soft-lock.</p>
            <h3>Grey-boxing a room</h3>
            <p>Double-click any room (or press <b>Enter</b> with it selected) to open a subdivided grid for that
               room, and block out its interior with typed boxes — solid, platform, hazard, water, ladder, exit,
               item, enemy, note. Doors on the room's border are drawn as anchors.</p>
            <h3>Storage</h3>
            <p>Maps autosave to your browser (IndexedDB, or localStorage when that isn't available). Use
               <b>Export</b> for a portable <code>.json</code> file and <b>PNG</b> for an image of the whole map.</p>
            <h3>Map shortcuts</h3>
            <div class="kbd-grid">
              <b>V</b><span>Select / move</span>
              <b>B</b><span>Paint cells</span>
              <b>R</b><span>Rectangle fill</span>
              <b>E</b><span>Erase cells</span>
              <b>D</b><span>Door</span>
              <b>K</b><span>Key</span>
              <b>H / Space</b><span>Pan</span>
              <b>Shift + paint</b><span>Start a new room</span>
              <b>Alt + paint</b><span>Erase instead</span>
              <b>F</b><span>Zoom to fit</span>
              <b>Enter</b><span>Grey-box selected room</span>
              <b>Del</b><span>Delete selection</span>
              <b>Ctrl + Z / Y</b><span>Undo / redo</span>
              <b>Ctrl + S</b><span>Export JSON</span>
            </div>
            <h3>Grey-box shortcuts</h3>
            <div class="kbd-grid">
              <b>B</b><span>Draw box</span>
              <b>V</b><span>Select / move / resize</span>
              <b>E</b><span>Erase box</span>
              <b>1–9</b><span>Pick box type</span>
              <b>Esc</b><span>Deselect, then back to map</span>
            </div>
            <div class="close-row"><button class="btn primary" data-close style="flex:0 0 auto;padding:6px 16px">Close</button></div>`);
        };

        $("#btn-maps").onclick = async () => {
          const all = (await Store.all()).sort((a, b) => (b.updated || 0) - (a.updated || 0));
          const rows = all.length
            ? all
                .map((d) => {
                  const when = d.updated ? new Date(d.updated).toLocaleString() : "—";
                  return `<div class="map-row">
                      <span class="nm"><b>${esc(d.name || "Untitled")}</b>${
                    d.id === S.doc.id ? ' <span class="sub">— open</span>' : ""
                  }<br /><span class="sub">${(d.rooms || []).length} rooms · ${(d.locks || []).length} locks · ${when}</span></span>
                      <button class="btn" data-open="${d.id}" style="flex:0 0 auto;padding:4px 12px">Open</button>
                      <button class="btn danger" data-delmap="${d.id}" style="flex:0 0 auto;padding:4px 12px">Delete</button>
                    </div>`;
                })
                .join("")
            : `<p>No saved maps yet.</p>`;
          openModal(`<h2>Saved maps</h2><p class="sub">Stored via ${
            Store.mode === "idb" ? "IndexedDB" : "localStorage"
          }.</p>${rows}<div class="close-row"><button class="btn primary" data-close style="flex:0 0 auto;padding:6px 16px">Close</button></div>`);

          $("#modal-box").querySelectorAll("[data-open]").forEach((b) => {
            b.onclick = () => {
              const d = all.find((x) => x.id === b.dataset.open);
              if (d) { loadDoc(d); closeModal(); }
            };
          });
          $("#modal-box").querySelectorAll("[data-delmap]").forEach((b) => {
            b.onclick = async () => {
              const id = b.dataset.delmap;
              const d = all.find((x) => x.id === id);
              if (!confirm(`Delete “${d ? d.name : "this map"}” permanently?`)) return;
              await Store.del(id);
              closeModal();
              if (id === S.doc.id) loadDoc(newDoc());
            };
          });
        };

        /* ══════════════════════════════════════════════════════════════
           18 · Boot
           ══════════════════════════════════════════════════════════════ */
        (async function boot() {
          await Store.init();
          if (Store.mode !== "idb") $("#file-note").classList.add("show");

          let doc = null;
          try {
            const lastId = localStorage.getItem("mvmap:last");
            if (lastId) {
              const all = await Store.all();
              doc = all.find((d) => d.id === lastId) || null;
            }
          } catch (e) {}

          S.doc = migrate(doc || newDoc());
          S.activeAreaId = S.doc.areas[0].id;
          $("#map-name").value = S.doc.name;
          $("#chk-flow").checked = S.showFlow;
          $("#chk-labels").checked = S.showLabels;
          setTool("paint");
          setDTool("box");
          renderTypePalette();
          reindex();
          renderUI();
          setStatus("saved");

          const [w, h] = resizeCanvas(worldCanvas, wctx);
          VW = w; VH = h;
          if (S.doc.rooms.length) fitWorld();
          needsDraw = true;
          requestAnimationFrame(frame);
        })();
      })();
    </script>
  </body>
</html>
